<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ScribeAI — SOAP notes from dictation</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap" />
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          ink: '#0A0A0A',
          paper: '#FAFAF9',
          teal: { DEFAULT: '#0F766E', 700: '#0F766E', 800: '#0B5F58', 600: '#13897F' },
          coral: { DEFAULT: '#F97066', 600: '#F97066' },
          line: '#E7E5E0',
          mute: '#6B6B66',
        },
        fontFamily: {
          sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
          serif: ['Lora', 'ui-serif', 'Georgia', 'serif'],
          mono: ['"JetBrains Mono"', 'ui-monospace', 'monospace'],
        },
        boxShadow: {
          card: '0 1px 0 rgba(15,23,42,.04), 0 1px 2px rgba(15,23,42,.04), 0 8px 24px -12px rgba(15,23,42,.08)',
          softer: '0 1px 0 rgba(15,23,42,.04), 0 1px 2px rgba(15,23,42,.04)',
        },
      }
    }
  }
</script>
<style>
  :root { color-scheme: light; }
  html, body { background: #FAFAF9; color: #0A0A0A; font-family: Inter, system-ui, sans-serif; }
  body { -webkit-font-smoothing: antialiased; }
  .font-display { font-family: Lora, Georgia, serif; letter-spacing: -0.015em; }
  /* subtle grid backdrop for hero */
  .bg-hairline {
    background-image:
      linear-gradient(to right, rgba(10,10,10,0.035) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(10,10,10,0.035) 1px, transparent 1px);
    background-size: 56px 56px;
    background-position: -1px -1px;
  }
  /* dotted divider */
  .dot-divider { background-image: radial-gradient(circle, #d6d3cc 1px, transparent 1px); background-size: 8px 8px; }
  .marquee-track { animation: marquee 36s linear infinite; }
  @keyframes marquee { from { transform: translateX(0); } to { transform: translateX(-50%); } }
  .pulse-rec { animation: pulseRec 1.6s ease-in-out infinite; }
  @keyframes pulseRec {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: .55; transform: scale(.92); }
  }
  .typing-cursor::after { content: '▍'; color: #0F766E; margin-left: 2px; animation: blink 1.1s steps(1) infinite; font-weight: 400; }
  @keyframes blink { 50% { opacity: 0; } }
  /* equalizer bars */
  .eq-bar { animation: eq 1.2s ease-in-out infinite; transform-origin: bottom; }
  .eq-bar:nth-child(1) { animation-delay: -0.1s; }
  .eq-bar:nth-child(2) { animation-delay: -0.4s; }
  .eq-bar:nth-child(3) { animation-delay: -0.7s; }
  .eq-bar:nth-child(4) { animation-delay: -0.2s; }
  .eq-bar:nth-child(5) { animation-delay: -0.5s; }
  .eq-bar:nth-child(6) { animation-delay: -0.8s; }
  .eq-bar:nth-child(7) { animation-delay: -0.3s; }
  @keyframes eq {
    0%, 100% { transform: scaleY(0.3); }
    50% { transform: scaleY(1); }
  }
  /* button hover lift */
  .btn-primary { background: #0F766E; color: white; transition: background .15s ease, transform .15s ease, box-shadow .15s ease; }
  .btn-primary:hover { background: #0B5F58; }
  .btn-ghost { transition: background .15s ease, border-color .15s ease; }
  .btn-ghost:hover { background: #F2F1ED; }

  /* focus rings */
  a:focus-visible, button:focus-visible { outline: 2px solid #0F766E; outline-offset: 2px; border-radius: 6px; }

  /* Tweaks marker */
  .density-comfy { --section-py: 7rem; }
  .density-regular { --section-py: 5.5rem; }
  .density-compact { --section-py: 4rem; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="scribeai-app.jsx"></script>
</body>
</html>
